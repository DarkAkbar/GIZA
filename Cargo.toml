[workspace]
resolver = "2"
members = ["src-tauri", "crates/dark-pc-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Giza"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
sysinfo = "0.33"
walkdir = "2"
mime_guess = "2"
sha2 = "0.10"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
